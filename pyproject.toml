[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tangentswarm"
dynamic = ["version"]
description = "tmux-based swarm launcher, coding-agent orchestration and an MCP server (stdio + OAuth HTTP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML",
    "tomli>=1.1; python_version < '3.11'",
    "mcp>=2.3,<3",
    "PyJWT[crypto]>=2.8",
    "uvicorn",
]

[project.optional-dependencies]
cloud = ["playwright>=1.45", "websockets>=13"]
test = ["pytest", "websockets>=13"]

[project.scripts]
swarm = "tangentswarm.cli:main"
swarm-mcp = "tangentswarm.mcp_server:main"
swarm-hub = "tangentswarm.queue.hub:main"
swarm-agent = "tangentswarm.agent_mcp_server:main"
swarm-tick = "tangentswarm.tick:main"
swarm-brief = "tangentswarm.brief:main"
swarm-hookgate = "tangentswarm.hookgate:main"
swarm-launch = "tangentswarm.launches:main"
swarm-lock = "tangentswarm.gatelock:main"
swarm-flow = "tangentswarm.flow:main"
swarm-promoted = "tangentswarm.promoted:main"
swarm-flow-status = "tangentswarm.flowstatus:main"
swarm-advance = "tangentswarm.advance:main"
swarm-slots = "tangentswarm.slots:main"
swarm-revive = "tangentswarm.slots:revive_main"
swarm-stop-hook = "tangentswarm.stophook:main"
swarm-worker-mcp = "tangentswarm.worker_mcp:main"
swarm-webhook = "tangentswarm.webhook:main"
swarm-events = "tangentswarm.events_view:main"
swarm-tmux-status = "tangentswarm.tmux_status:main"

[tool.setuptools]
packages = ["tangentswarm", "tangentswarm.cloud", "tangentswarm.queue"]

[tool.setuptools.package-data]
tangentswarm = ["config.example.toml"]

[tool.setuptools.dynamic]
version = { attr = "tangentswarm.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
